# پیکربندی pytest — اجرای تست‌ها:
#   BOT_TOKEN=1:x ADMIN_ID=1 ADMIN_API_SECRET=x python -m pytest
# ⭐ asyncio_mode=auto: همهٔ تست‌های async بدون نیاز به @pytest.mark.asyncio
# هم اجرا می‌شوند (مارکرها برای سازگاری نگه داشته شده‌اند) — بدون این،
# pytest-asyncio نصب‌شده هم تست‌های async را «async def function ... never
# awaited» رد می‌کرد.
[pytest]
asyncio_mode = auto
testpaths = .
python_files = test_*.py
# فایل‌های کمکی/اسکریپت‌های بررسی (check_*.py) تست نیستند
norecursedirs = .git node_modules temp_files data scripts .next
